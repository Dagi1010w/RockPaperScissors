<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="RPS-withCSS-style.css">
    </head>
    <body>
        <header class="header">
            <p class="title-paragraph">Rock Paper Scissors</p>
        </header>

        <div class="move-container">
            <button class="button-image rock-btn">
                <img src="Images/rock.image.jpg" class="move-image">
            </button>
    
            <button class="button-image paper-btn">
                <img src="Images/paper.image.jpg" class="move-image">
            </button>
    
            <button class="button-image sicissors-btn">
                <img src="Images/scissors.image.jpg" class="move-image">
            </button>
        </div>
        <div class="score-container">
            <p class="result"></p>
            <p class="moves"></p>
            <p class="scorebord"></p>
            <button class="reset-button">Reset Button</button>
        </div>

        <script src="RPS-withCSS-javascript.js"></script>
    </body>
</html>
